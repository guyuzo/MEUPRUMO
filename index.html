<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Prumo</title>
    <meta name="description" content="Meu Prumo: organize as finanças da sua casa. Contas, cartões, orçamento, metas e família num só lugar. Sua vida financeira no prumo." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0D4D3B" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)" />
    <script>
      // Aplica o tema antes do primeiro paint (evita piscar claro no modo escuro). Ver src/lib/theme.ts.
      try {
        var t = localStorage.getItem('ff.theme')
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
